services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zynora
      POSTGRES_USER: zynora
      POSTGRES_PASSWORD: zynora_dev
    ports:
      - "5432:5432"
    volumes:
      - zynora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynora -d zynora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zynora-postgres:
